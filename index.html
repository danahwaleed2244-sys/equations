i.pre{background:#9AA6C9} i.post{background:var(--c3)} i.bad{background:var(--bad)}

td.wrap{white-space:normal;min-width:160px}
table.kv th{width:55%}
.tag.warn{background:var(--grid);color:var(--c2)}
.tag{background:var(--grid)}
.qa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}

  const a=ri(r,2,6),x=ri(r,2,15),b=nz(r,-12,12),c=a*x+b;

 },
 write(r){
  if(r()<0.4){const odd=r()<0.5,n=ri(r,1,30)*(odd?2:1)-(odd?1:0),inc=odd?6:3,S=3*n+inc;
   const correct=`${N(3)}ن + ${N(inc)} = ${N(S)}`;
   const wrongs=[`${N(3)}ن + ${N(odd?3:6)} = ${N(S)}`,`${N(3)}ن = ${N(S)}`,`ن + ${N(inc)} = ${N(S)}`];
   return Object.assign({skill:"write",prompt:"أي معادلة تمثل المسألة؟ (العدد الأول ن)",eq:`ثلاثة أعداد صحيحة ${odd?"فردية ":""}متتالية مجموعها ${N(S)}`,eqText:true,
    steps:[odd?"الأعداد: ن، ن + ٢، ن + ٤":"الأعداد: ن، ن + ١، ن + ٢",`مجموعها: ٣ن + ${N(inc)}`,`المعادلة: ${correct}`]},pack(r,correct,wrongs));}
  const plus=r()<0.5,k=ri(r,2,6);let a;do{a=ri(r,1,9);}while(a===k);
  let n,c;if(plus){n=ri(r,1,9);c=k*n+a;}else{n=ri(r,Math.ceil((a+1)/k),9);c=k*n-a;}
  const kw=k===2?"مِثلا":`${N(k)} أمثال`;
  const sentence=`${kw} عدد ${plus?"مضافاً إليه":"مطروحاً منه"} ${N(a)} يساوي ${N(c)}`;
  const correct=plus?`${N(k)}ن + ${N(a)} = ${N(c)}`:`${N(k)}ن − ${N(a)} = ${N(c)}`;
  const wrongs=plus?[`${N(k)}(ن + ${N(a)}) = ${N(c)}`,`${N(a)}ن + ${N(k)} = ${N(c)}`,`${N(k)}ن − ${N(a)} = ${N(c)}`]
                   :[`${N(a)} − ${N(k)}ن = ${N(c)}`,`${N(k)}(ن − ${N(a)}) = ${N(c)}`,`${N(k)}ن + ${N(a)} = ${N(c)}`];
  const steps=["نرمز للعدد المجهول بالرمز ن",`«${kw}» تعني الضرب: ${N(k)}ن`,`«${plus?"مضافاً إليه":"مطروحاً منه"}» تعني ${plus?"الجمع":"الطرح"}، و«يساوي» تعني =`,`المعادلة: ${correct}`];
  return Object.assign({skill:"write",prompt:"أي معادلة تمثل الجملة الآتية؟",eq:sentence,eqText:true,steps},pack(r,correct,wrongs));
 },
 onestep(r){
  const t=ri(r,0,3);let x=nz(r,-9,15),eq,cands,steps;
  if(t===0){const a=ri(r,2,15),b=x+a;eq=`س + ${N(a)} = ${N(b)}`;cands=[b+a,a-b,b];steps=[`اطرحي ${N(a)} من الطرفين`,`س = ${N(b)} − ${N(a)} = ${N(x)}`];}

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
function FR(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;if(d===1)return N(n);return `<bdi dir="ltr">${frac(ar(Math.abs(n)),ar(d))}${n<0?"−":""}</bdi>`;}
function MX(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;const s=n<0?"−":"";n=Math.abs(n);if(d===1)return N(s?-n:n);const w=Math.floor(n/d),r=n%d;return `<bdi dir="ltr">${w?ar(w)+" ":""}${frac(ar(r),ar(d))}${s}</bdi>`;}
const FV=(n,d)=>Math.abs(n)>Math.abs(d)?MX(n,d):FR(n,d);
function DC(x){let s=String(+(+x).toFixed(8));const neg=s.startsWith("-");if(neg)s=s.slice(1);return `<bdi dir="ltr">${ar(s).replace(".","٫")}${neg?"−":""}</bdi>`;}
const SC=(a,k)=>`${DC(a)} × <bdi dir="ltr"><sup>${ar(Math.abs(k))}${k<0?"−":""}</sup>${ar(10)}</bdi>`;

function byVal(cv,cands,fill){const out=[],seen=[cv];for(const [v,hh] of cands){if(v==null||!isFinite(v))continue;if(seen.some(x=>Math.abs(x-v)<1e-9))continue;seen.push(v);out.push(hh);if(out.length===3)break;}let k=1;while(out.length<3&&fill){const [v,hh]=fill(k++);if(!seen.some(x=>Math.abs(x-v)<1e-9)){seen.push(v);out.push(hh);}}return out;}

 return allNames().map(n=>{const pre=latest(n,"pre"),post=latest(n,"post"),t=DB.tr[n]||{};let c=0,tt=0;Object.values(t).forEach(v=>{c+=v.c;tt+=v.t;});
  const pp=pctOf(pre),po=pctOf(post);
  return{n,cls:clsOf(n)||"—",pre,post,pp,po,imp:pp!=null&&po!=null?po-pp:null,weakPre:weakOf(pre),weakPost:weakOf(post),c,tt};});
}

/* statistics: paired t-test (same method as the numbers-and-operations dashboard) */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function impact(pairs){const n=pairs.length;if(n<2)return{n};
 const mPre=pairs.reduce((s,p)=>s+p[0],0)/n,mPost=pairs.reduce((s,p)=>s+p[1],0)/n,d=pairs.map(p=>p[1]-p[0]),md=mPost-mPre;
 const sd=Math.sqrt(d.reduce((s,x)=>s+(x-md)**2,0)/(n-1)),df=n-1;let t=sd>0?md/(sd/Math.sqrt(n)):(md===0?0:Infinity);
 const p=isFinite(t)?ibeta(df/(df+t*t),df/2,.5):0,eta=isFinite(t)?t*t/(t*t+df):1,cd=sd>0?md/sd:null,blake=mPre<100?(mPost-mPre)/(100-mPre)+(mPost-mPre)/100:null;
 return{n,mPre,mPost,md,sd,t,df,p,eta,cd,blake};}
const etaTxt=e=>e==null?"":e>=0.14?"أثر كبير":e>=0.06?"أثر متوسط":e>=0.01?"أثر صغير":"أثر ضعيف جداً";
const dTxt=d=>{if(d==null)return"";const a=Math.abs(d);return a>=0.8?"كبير":a>=0.5?"متوسط":a>=0.2?"صغير":"ضعيف";};

 ORDER.forEach(s=>{out[s].p=out[s].t?out[s].c/out[s].t*100:null;});return out;}

function qAnalysis(kind){
 const ids=kind==="pre"?PRE:POST,stat=ids.map(()=>({t:0,c:0,w:{}}));
 rowsAll().forEach(r=>{const rec=r[kind];if(!rec||!rec.answers||!rec.qids)return;rec.qids.forEach((id,i)=>{const k=ids.indexOf(id);if(k<0)return;const s=stat[k],a=rec.answers[i];s.t++;if(a===BYID[id].ans)s.c++;else if(a!=null)s.w[a]=(s.w[a]||0)+1;});});
 const n=Math.max(0,...stat.map(s=>s.t));
 if(!n)return `<p class="note">لا توجد إجابات ${kind==="pre"?"قبلي":"بعدي"} بعد.</p>`;
 return `<p class="note">عدد الطالبات: ${ar(n)}. الأسئلة التي نسبتها أقل من ٥٠٪ مميزة بالأحمر.</p>
 ${ids.map((id,k)=>{const q=BYID[id],s=stat[k],p=s.t?s.c/s.t*100:null;const ww=Object.entries(s.w).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="qa ${p!=null&&p<50?"low":""}"><div class="qa-h"><span>${ar(k+1)}. ${q.prompt}</span><span class="tag">${SKILLS[q.skill].name}</span></div>
  ${q.eq?`<div class="qa-eq">${q.eq}</div>`:""}
  ${hbar("الإجابة الصحيحة",[{cls:p!=null&&p<50?"bad":"post",p}])}
  <p class="note">الإجابة الصحيحة: ${q.opts[q.ans]}${ww?`، وأكثر خيار خاطئ: ${q.opts[ww[0]]} (${ar(ww[1])} ${ww[1]===1?"طالبة":"طالبات"})`:""}</p></div>`;}).join("")}`;
}

function burst(el){try{if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;const b=el.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;for(let i=0;i<12;i++){const s=document.createElement("span");s.className="burst";s.textContent=SYMS[i%SYMS.length];const ang=Math.PI*2*i/12,d=60+Math.random()*50;s.style.cssText=`left:${x}px;top:${y}px;color:var(--c${1+i%4});--dx:${Math.cos(ang)*d}px;--dy:${Math.sin(ang)*d}px;--rot:${Math.round(Math.random()*180)}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),950);}}catch(e){}}

/* ---------- student PIN ---------- */
const toEnDigits=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\s+/g,"");
async function pinHash(name,code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pin|"+name+"|"+code));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);}
async function checkPin(){
 if(!S.student)return false; if(S.verified===S.student)return true;
 const st=STUDENTS.find(s=>s.n===S.student); if(!st||!st.h){S.err="اختاري اسمك من القائمة.";render();return false;}
 const code=toEnDigits(S.pinVal); if(!code){S.err="اكتبي رمزك السري أولاً.";render();return false;}
 let h=""; try{h=await pinHash(st.n,code);}catch(e){S.err="المتصفح لا يدعم التحقق. افتحي الرابط من Safari أو Chrome.";render();return false;}
 if(h!==st.h){S.err="الرمز السري غير صحيح. تأكدي منه أو اسألي المعلمة.";S.pinVal="";render();return false;}
 S.verified=S.student;S.err="";return true;
}

/* ---------- actions ---------- */
const SEEN=new Set();
function pickTrain(skill){const pool=BANK.filter(q=>q.skill===skill&&!POST.includes(q.id)&&!SEEN.has(q.id));if(pool.length&&Math.random()<0.5){const q=pool[Math.floor(Math.random()*pool.length)];SEEN.add(q.id);return q;}return G[skill](rng((Math.random()*4294967296)>>>0));}
function newTrainQ(skill){S.train={skill,q:pickTrain(skill),picked:null,streak:S.train&&S.train.skill===skill?S.train.streak:0};}
const A={
 home(){go("home");},
 teacher(){S.copyText="";S.err="";go("teacher");},
 async tlogin(){const c1=document.getElementById("c1"),c2=document.getElementById("c2"),a=c1?c1.value:"";
  if(remote()){if(!a){S.err="اكتبي الرمز.";render();return;}S.err="جارٍ تحميل النتائج…";render();
   try{S.role=await pullAll(a);S.tcodePlain=a;S.err="";S.tAuth=true;S.tab=S.tab||"over";render();}catch(e){S.err=String(e.message)==="code"?"الرمز لا يطابق الرمز المكتوب في Google Apps Script.":"تعذّر الاتصال بـ Google Sheets. تأكدي من الإنترنت ومن رابط Apps Script.";render();}
   return;}
  if(!DB.tcode){if(a.length<4){S.err="الرمز ٤ أرقام على الأقل.";render();return;}if(!c2||a!==c2.value){S.err="الرمزان غير متطابقين.";render();return;}DB.tcode=await hashCode(a);save();}
  else if((await hashCode(a))!==DB.tcode){S.err="الرمز غير صحيح.";render();return;}
  S.err="";S.tAuth=true;S.tab=S.tab||"over";render();},
 tout(){S.tAuth=false;S.tcodePlain="";if(remote())DB=load();go("home");},
 async refresh(){if(!remote())return;S.status="";try{await pullAll(S.tcodePlain);S.status="تم التحديث";}catch(e){S.status="تعذّر التحديث";}render();},
 tab(b){S.tab=b.dataset.k;S.status="";S.copyText="";S.confirmClear=false;render();},
 qk(b){S.qk=b.dataset.k;render();},
 async trainlist(){if(S.view==="home"&&S.student&&!(await checkPin()))return;go("trainlist");},
 async start(b){if(!S.student.trim())return;if(!(await checkPin()))return;S.quiz={kind:b.dataset.kind,qs:makeTest(b.dataset.kind),i:0,ans:Array(PRE.length).fill(null)};go("quiz");},
 pick(b){const j=+b.dataset.j;
  if(S.view==="quiz"){S.quiz.ans[S.quiz.i]=j;render();return;}
  if(S.view==="train"){const T=S.train;if(T.picked!==null)return;T.picked=j;const ok=j===T.q.ans;T.streak=ok?T.streak+1:0;
   const name=S.student.trim();if(name){const tr=DB.tr[name]||(DB.tr[name]={});const s=tr[T.skill]||(tr[T.skill]={c:0,t:0});s.t++;if(ok)s.c++;save();pushTr(name);}
   render();if(ok){const c=document.querySelector(".opt.ok");if(c)burst(c);}}
 },
 next(){S.quiz.i++;render();window.scrollTo(0,0);},
 prev(){S.quiz.i--;render();window.scrollTo(0,0);},
 finish(){const Q=S.quiz,skills={};let score=0;
  Q.qs.forEach((q,i)=>{const ok=Q.ans[i]===q.ans;if(ok)score++;const v=skills[q.skill]||(skills[q.skill]=[0,0]);v[1]++;if(ok)v[0]++;});
  const rec={name:S.student.trim(),cls:clsOf(S.student.trim()),kind:Q.kind,score,total:Q.qs.length,skills,qids:Q.qs.map(q=>q.id),answers:Q.ans.slice(),date:new Date().toISOString(),type:"res",id:"r_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)};
  DB.rec.push(rec);save();post({action:"save",record:rec});S.verified=null;S.pinVal="";S.result={rec,qs:Q.qs,ans:Q.ans};S.quiz=null;go("result");if(score>=7){const sc=document.querySelector(".score");if(sc)burst(sc);}
 },
 train(b){S.train=null;newTrainQ(b.dataset.skill);go("train");},
 newq(){newTrainQ(S.train.skill);render();window.scrollTo(0,0);},
 copy(){const lines=["الطالبة\tالفصل\tالقبلي\tالبعدي\tالتغير\tمهارات الضعف"].concat(summaryRows().map(r=>[r.n,r.cls,r.pre?r.pre.score:"",r.post?r.post.score:"",r.diff===null?"":r.diff,r.weak.join("، ")].join("\t")));
  const text=lines.join("\n");
  const fallback=()=>{S.copyText=text;S.status="";render();const t=document.getElementById("copyBox");if(t)t.select();};
  try{navigator.clipboard.writeText(text).then(()=>{S.copyText="";S.status="نُسخ الملخص";render();},fallback);}catch(e){fallback();}
 },
 clear(){if(S.role==="viewer")return;if(!S.confirmClear){S.confirmClear=true;render();return;}if(remote())post({action:"clear",code:S.tcodePlain});DB={rec:[],tr:{},tcode:DB.tcode};save();S.confirmClear=false;render();}
};
const GR={
 g2:{label:"الثاني المتوسط",title:"الأعداد النسبية",icon:"٢",formula:`${f("١","٢")} + ${f("١","٤")} = ${f("٣","٤")}`,trip:"الأعداد النسبية",key:"remedial-rational-v1",STUDENTS:STUDENTS2,SKILLS:SKILLS2,SYM:SYM2,ORDER:ORDER2,PRE:PRE2,POST:POST2,BANK:BANK2,BYID:BYID2,G:G2},
 g3:{label:"الثالث المتوسط",title:"المعادلات الخطية",icon:"٣",formula:`${N(2)}س + ${N(3)} = ${N(7)}`,trip:TRIP,key:KEY,STUDENTS,SKILLS,SYM,ORDER,PRE,POST,BANK,BYID,G}
};
function setGrade(k){const g=GR[k];if(!g)return;S.grade=k;STUDENTS=g.STUDENTS;SKILLS=g.SKILLS;SYM=g.SYM;ORDER=g.ORDER;PRE=g.PRE;POST=g.POST;BANK=g.BANK;BYID=g.BYID;G=g.G;TRIP=g.trip;KEY=g.key;
 const cs=[];STUDENTS.forEach(s=>{if(!cs.includes(s.c))cs.push(s.c);});CLASSES=cs;S.cls="";DB=load();try{localStorage.setItem("remedial-grade",k);}catch(e){}}
A.grade=b=>{setGrade(b.dataset.k);S.student="";S.other=false;S.verified=null;S.pinVal="";S.err="";go("home");};
A.chgrade=()=>{S.grade=null;S.student="";S.other=false;S.verified=null;S.pinVal="";S.err="";go("home");};
A.tgrade=async b=>{setGrade(b.dataset.k);S.status="";if(remote()&&S.tAuth){S.status="جارٍ التحميل…";render();try{await pullAll(S.tcodePlain);S.status="";}catch(e){S.status="تعذّر التحميل";}}render();};
const _teacher=A.teacher;A.teacher=b=>{if(!S.grade)setGrade("g3");_teacher(b);};
try{const k=localStorage.getItem("remedial-grade");if(k&&GR[k])setGrade(k);}catch(e){}
app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b);});
render();
})();

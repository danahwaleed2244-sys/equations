.btn.sm{padding:4px 10px;min-height:0;font-size:.85rem}

.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}

.tag{background:var(--grid)}

function pMsg(r){
 const pin=S.pins&&S.pins[r.n],first=r.n.split(" ")[0],t=GR[S.grade].title,url=toolUrl(),sig="معلمة المادة: لطفيه الطلحي";
 const hi=`السلام عليكم ورحمة الله وبركاته،\nولي أمر الطالبة ${first} المحترم.`;

 if(GR[S.grade].enrich){if(!r.pre)return `${hi}\nيسعدنا إفادتكم بأن ابنتكم من الطالبات المتفوقات في الرياضيات، وقد اختيرت للخطة الإثرائية (${t.replace("الإثراء: ","")}). نأمل تشجيعها على حل بطاقة التحدي عبر الرابط:\n${url}${pin?`\nالرمز السري للدخول: ${ar(pin)}`:""}\nشاكرين تعاونكم.\n${sig}`;
  return `${hi}\nيسعدنا إفادتكم بأن ابنتكم أنجزت بطاقة التحدي في الخطة الإثرائية لمادة الرياضيات، وحصلت على ${ar(r.pre.score)} من ${ar(r.pre.total)}. ${r.pre.score>=8?"وهو أداء متميز نفخر به":"ونشكر لها مثابرتها"}، ونرجو منكم مواصلة تشجيعها.\n${sig}`;}
 if(!r.pre)return `${hi}\nنفيدكم بأن ابنتكم ضمن الخطة العلاجية لمادة الرياضيات (${t}). نأمل حثّها على أداء الاختبار القبلي عبر الرابط:\n${url}\nباستخدام رمزها السري${pin?`: ${ar(pin)}`:" الذي سلّمته لها المعلمة"}.\nشاكرين تعاونكم.\n${sig}`;
 const weak=r.weakPre.map(s=>SKILLS[s].name).join("، ");
 if(!r.post)return `${hi}\nنفيدكم بأن ابنتكم أدّت الاختبار القبلي في الرياضيات (${t}) وحصلت على ${ar(r.pre.score)} من ${ar(r.pre.total)}.\n${weak?`المهارات التي تحتاج متابعة: ${weak}.`:"أتقنت جميع المهارات، بارك الله فيها."}${tr}\nنأمل متابعتها في التدريب العلاجي على الرابط:\n${url}${pin?`\nالرمز السري للدخول: ${ar(pin)}`:""}\nشاكرين تعاونكم.\n${sig}`;
 const d=r.post.score-r.pre.score,ch=d>0?`تحسّنت بمقدار ${ar(d)} درجات`:d<0?`انخفضت بمقدار ${ar(-d)} درجات`:"بقيت درجتها كما هي";
 const good=d>0&&r.po>=50;
 const weakP=r.weakPost.map(s=>SKILLS[s].name).join("، ");
 return `${hi}\nنفيدكم بأن ابنتكم أنهت الخطة العلاجية في الرياضيات (${t}):\nالاختبار القبلي: ${ar(r.pre.score)} من ${ar(r.pre.total)}\nالاختبار البعدي: ${ar(r.post.score)} من ${ar(r.post.total)}\nوقد ${ch}.${tr}\n${good?"نشكر لكم متابعتكم، ونرجو الاستمرار في تشجيعها.":`${weakP?`ما زالت تحتاج متابعة في: ${weakP}. `:""}وسنستمر معها في الخطة العلاجية، ونأمل متابعتكم لها في المنزل.`}\n${sig}`;
}

const SYMS=["+","−","×","÷","=","س","π","√","∞","٪","≠","ن","( )","| |","٣","٧"];
(function(){const bg=document.getElementById("bg");if(!bg)return;let out="";for(let i=0;i<20;i++){const s=SYMS[i%SYMS.length],c=`var(--c${1+i%4})`,left=Math.round(Math.random()*96),size=1.2+Math.random()*2.6,dur=22+Math.random()*26,delay=-Math.random()*dur,top=Math.round(Math.random()*90);out+=`<span style="left:${left}%;top:${top}%;color:${c};font-size:${size.toFixed(1)}rem;animation-duration:${dur.toFixed(0)}s;animation-delay:${delay.toFixed(0)}s">${s}</span>`;}bg.innerHTML=out;bg.querySelectorAll("span").forEach(sp=>{sp.style.top="auto";});})();
function burst(el){try{if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;const b=el.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;for(let i=0;i<12;i++){const s=document.createElement("span");s.className="burst";s.textContent=SYMS[i%SYMS.length];const ang=Math.PI*2*i/12,d=60+Math.random()*50;s.style.cssText=`left:${x}px;top:${y}px;color:var(--c${1+i%4});--dx:${Math.cos(ang)*d}px;--dy:${Math.sin(ang)*d}px;--rot:${Math.round(Math.random()*180)}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),950);}}catch(e){}}

const toEnDigits=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\s+/g,"");
async function pinHash(name,code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pin|"+name+"|"+code));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24);}
async function checkPin(){
 if(!S.student)return false; if(S.verified===S.student)return true;
 const st=STUDENTS.find(s=>s.n===S.student); if(!st||!st.h){S.err="اختاري اسمك من القائمة.";render();return false;}
 const code=toEnDigits(S.pinVal); if(!code){S.err="اكتبي رمزك السري أولاً.";render();return false;}
 let h=""; try{h=await pinHash(st.n,code);}catch(e){S.err="المتصفح لا يدعم التحقق. افتحي الرابط من Safari أو Chrome.";render();return false;}
 if(h!==st.h){S.err="الرمز السري غير صحيح. تأكدي منه أو اسألي المعلمة.";S.pinVal="";render();return false;}
 S.verified=S.student;S.err="";return true;
}

function hash5(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return 10000+(h%90000);}
function firstRec(name,kind){return DB.rec.filter(r=>r.type!=="tr"&&r.name===name&&r.kind===kind).sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0]||null;}
function certOf(name){
 const g=GR[S.grade];if(!g)return null;let f,c;
 if(g.enrich){f=firstRec(name,"pre");if(!f)return null;c={type:f.score>=8?"tm":"in",score:f.score,total:f.total};}
 else{f=firstRec(name,"post");const p=firstRec(name,"pre");if(!f||!p||f.score-p.score<2)return null;c={type:"th",score:f.score,total:f.total,from:p.score};}
 return Object.assign(c,{name,cls:clsOf(name)||f.cls||"",unit:S.grade,date:f.date,rid:f.id,no:"ش-"+ar(hash5(name+"|"+S.grade+"|"+(f.id||f.date)))});
}

async function decPins(code){S.pins={};try{const kb=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pinkey|"+code));const key=await crypto.subtle.importKey("raw",kb,"AES-GCM",false,["decrypt"]);
 const all=[];Object.values(GR).forEach(g=>g.STUDENTS.forEach(s=>{if(s.e&&!all.includes(s))all.push(s);}));
 for(const s of all){try{const b=Uint8Array.from(atob(s.e),c=>c.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));S.pins[s.n]=new TextDecoder().decode(pt);}catch(e){}}}catch(e){}}

/* شبكة تربيع (المستوى الإحداثي) مع نقطتين، واختيارياً المثلث القائم */
function GRD(p1,p2,tri){
 const xs=[p1[0],p2[0],0],ys=[p1[1],p2[1],0];
 const x0=Math.min(...xs)-1,x1=Math.max(...xs)+1,y0=Math.min(...ys)-1,y1=Math.max(...ys)+1,c=42,W=(x1-x0)*c,H=(y1-y0)*c;
 const X=x=>(x-x0)*c,Y=y=>(y1-y)*c;let s=`<svg class="grd" viewBox="-14 -14 ${W+28} ${H+28}" width="${Math.min(W+28,380)}" role="img" aria-label="مستوى إحداثي"><g stroke="var(--line)" stroke-width="1">`;
 for(let x=x0;x<=x1;x++)s+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}"/>`;
 for(let y=y0;y<=y1;y++)s+=`<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}"/>`;
 s+=`</g><g stroke="currentColor" stroke-width="2"><line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}"/></g>`;
 s+=`<g fill="currentColor" font-size="15" font-family="inherit"><text x="${W-4}" y="${Y(0)-6}" text-anchor="end">س</text><text x="${X(0)+6}" y="14">ص</text></g>`;
 if(tri){s+=`<g stroke="var(--c2)" stroke-width="2.5" stroke-dasharray="6 4" fill="none"><line x1="${X(p1[0])}" y1="${Y(p1[1])}" x2="${X(p2[0])}" y2="${Y(p1[1])}"/><line x1="${X(p2[0])}" y1="${Y(p1[1])}" x2="${X(p2[0])}" y2="${Y(p2[1])}"/></g><line x1="${X(p1[0])}" y1="${Y(p1[1])}" x2="${X(p2[0])}" y2="${Y(p2[1])}" stroke="var(--c1)" stroke-width="2.5"/>`;}
 for(const p of [p1,p2])s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="var(--c1)"/>`;
 return s+`</svg>`;
}
